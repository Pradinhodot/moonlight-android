name: Build Artemis HDR APK

# Builds the customized client (HDR fixes + own name/id) in the cloud.
# Runs on every push and can be triggered manually from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.0.12077973
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK (nonRoot_game flavor)
        run: ./gradlew assembleNonRoot_gameDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: artemis-hdr-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
